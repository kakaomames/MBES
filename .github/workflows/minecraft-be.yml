name: Minecraft Bedrock Cloud Server (BE + Playit.gg APT)

on:
  workflow_dispatch:

jobs:
  run-bedrock-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 最大6時間

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & Playit.gg
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl libcurl4 gpg
          
          # Playit.gg公式APTリポジトリのセットアップ
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt update
          sudo apt install -y playit

      - name: Download & Extract Minecraft Bedrock Server
        run: |
          curl -H "User-Agent: Mozilla/5.0" \
               https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.21.51.01.zip \
               -o bedrock.zip
          unzip -o bedrock.zip
          chmod +x bedrock_server

      - name: Start Playit.gg & Bedrock Server (Max 5.5 hours)
        run: |
          # 1. バックグラウンドでBedrockサーバーを起動
          LD_LIBRARY_PATH=. ./bedrock_server > server.log 2>&1 &
          echo "Bedrock server started in background!"

          # 2. バックグラウンドでPlayit.ggを起動
          playit > playit.log 2>&1 &
          echo "Playit.gg agent started in background!"

　　　　　　sleep 60
          cat playit.log

          # 5時間半（330分 = 19800秒）待機
          sleep 19800

          # 時間切れになったら安全に停止
          echo "stop" > /proc/$(pgrep bedrock_server)/fd/0 || true
          sleep 10

      - name: Save World & Push to Repository
        if: always()
        run: |
          git config --local user.name "action-bot"
          git config --local user.email "action@github.com"
          
          git add worlds/ server.log playit.log || echo "No changes to add"
          git commit -m "Auto-save Bedrock world data after session [skip ci]" || echo "No changes to commit"
          
          git pull --rebase || true
          git push
